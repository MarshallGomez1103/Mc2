# Variables del contrato común; los mismos valores que .env.example.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mc2-config
  namespace: mc2
  labels:
    app.kubernetes.io/part-of: minecraft2
data:
  MC2_SERVER_HOST: mc2-server
  MC2_SERVER_PORT: "7777"
  MC2_HEALTH_PORT: "8080"
  MC2_TICK_HZ: "20"
  MC2_LOAD_ZOMBIES: "0"
  MC2_WORLD_DIR: /data/worlds
  MC2_PLAYER_NAME: jugador
  MC2_SKIN_ID: "0"
