# Plantilla sin credenciales: NO se aplica con kustomization.yaml ni se versiona con valores reales.
# Solo hace falta si las imágenes de GHCR son privadas. Se crea con:
#   kubectl -n mc2 create secret docker-registry ghcr-lectura \
#     --docker-server=ghcr.io --docker-username=<usuario> --docker-password=<token con read:packages>
# y se referencia en los Deployment con imagePullSecrets: [{name: ghcr-lectura}].
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-lectura
  namespace: mc2
  labels:
    app.kubernetes.io/part-of: minecraft2
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"<base64 de usuario:token>"}}}'
