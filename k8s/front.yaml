# mc2-front: cliente en el navegador (noVNC). Se accede con kubectl port-forward; no se expone fuera del clúster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mc2-front
  namespace: mc2
  labels:
    app.kubernetes.io/part-of: minecraft2
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mc2-front
  namespace: mc2
  labels:
    app.kubernetes.io/name: mc2-front
    app.kubernetes.io/part-of: minecraft2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mc2-front
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mc2-front
        app.kubernetes.io/part-of: minecraft2
        # Etiqueta que la NetworkPolicy exige para hablar con el puerto de juego.
        mc2/cliente: "true"
    spec:
      serviceAccountName: mc2-front
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc2-front
          image: ghcr.io/marshallgomez1103/mc2-front:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: mc2-config
          ports:
            - name: novnc
              containerPort: 6080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /vnc.html
              port: novnc
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["bash", "-c", "kill -0 \"$(cat /tmp/mc2-client.pid)\""]
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/app
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: home
          emptyDir:
            sizeLimit: 256Mi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mc2-front
  namespace: mc2
  labels:
    app.kubernetes.io/name: mc2-front
    app.kubernetes.io/part-of: minecraft2
spec:
  selector:
    app.kubernetes.io/name: mc2-front
  ports:
    - name: novnc
      port: 6080
      targetPort: novnc
      protocol: TCP
