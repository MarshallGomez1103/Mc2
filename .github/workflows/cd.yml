# Entrega continua de Minecraft2 (Corte 3, C3-06): imágenes en GHCR, despliegue con Compose, readiness,
# humo, carga corta con el SLO y reversión. Los ids de los jobs son los nombres de los checks: no renombrarlos.
#
# Disparadores:
#   pull_request        → entorno efímero: construye las dos imágenes, levanta Compose, humo y carga corta. No publica.
#   ci.yml verde en main → publica con la etiqueta del SHA, despliega, humo y carga; si fallan, revierte.
#   tag vX.Y.Z          → etiqueta la imagen del SHA con la versión, la despliega y publica la Release con el JAR del cliente.
#   workflow_dispatch   → reversión manual a una etiqueta publicada (input «revertir_a»).
name: cd

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      revertir_a:
        description: 'Etiqueta publicada a restaurar (SHA de 40 caracteres o vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Un solo despliegue a la vez sobre el entorno; los pull requests no compiten con main.
  group: ${{ github.event_name == 'pull_request' && format('cd-pr-{0}', github.ref) || 'cd-despliegue' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # SHA verificado: en workflow_run es el commit que ci.yml probó, no la punta actual de main.
  MC2_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  # Pull request: el mismo Compose, construido desde el código del pull request, en un runner hospedado efímero.
  entorno-efimero:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Minecraft2/pom.xml
      - name: Construir y levantar mc2-server y mc2-front con 80 zombis
        env:
          MC2_LOAD_ZOMBIES: '80'
          MC2_IMAGE_TAG: pr
        run: |
          cp .env.example .env
          docker compose up --build --wait --wait-timeout 300 || { docker compose logs --no-color --tail 100; exit 1; }
      - name: Prueba de humo (la misma que el despliegue)
        run: scripts/deploy.sh --humo
      - name: Carga corta con el SLO (3 × 30 s)
        env:
          MC2_LOAD_ZOMBIES: '80'
          MC2_LOAD_OUT: ${{ runner.temp }}/carga
        run: cd Minecraft2 && perf/run-slo.sh corta
      - name: Publicar resultados de carga
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carga-pr-${{ env.MC2_SHA }}
          path: ${{ runner.temp }}/carga/
          if-no-files-found: warn
          retention-days: 14
      - name: Apagar el entorno
        if: always()
        run: docker compose down -v

  # main (tras ci.yml en verde) y tags: imágenes en GHCR etiquetadas con el SHA y, si hay tag, con la versión.
  publicar:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      etiqueta: ${{ steps.etiqueta.outputs.etiqueta }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MC2_SHA }}
          persist-credentials: false
      - name: Etiqueta a desplegar
        id: etiqueta
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then echo "etiqueta=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else echo "etiqueta=$MC2_SHA" >> "$GITHUB_OUTPUT"; fi
          echo "MC2_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Iniciar sesión en GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$TOKEN"
      - name: Construir y publicar (o reetiquetar) mc2-server y mc2-front
        env:
          ETIQUETA: ${{ steps.etiqueta.outputs.etiqueta }}
        run: |
          version="${ETIQUETA}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || version="0.0.0-${MC2_SHA:0:7}"
          for servicio in server front; do
            imagen="${MC2_REGISTRY}/mc2-${servicio}"
            dockerfile=Minecraft2/Dockerfile; [[ "$servicio" == front ]] && dockerfile=Minecraft2/Dockerfile.front
            # Un tag reutiliza la imagen ya verificada de su SHA; solo se construye si no existe.
            if [[ "$GITHUB_REF_TYPE" == "tag" ]] && docker buildx imagetools inspect "${imagen}:${MC2_SHA}" >/dev/null 2>&1; then
              docker buildx imagetools create -t "${imagen}:${ETIQUETA}" "${imagen}:${MC2_SHA}"
            else
              docker build -f "$dockerfile" \
                --build-arg MC2_VERSION="$version" --build-arg MC2_REVISION="$MC2_SHA" \
                -t "${imagen}:${MC2_SHA}" -t "${imagen}:${ETIQUETA}" Minecraft2
              docker push "${imagen}:${MC2_SHA}"
              [[ "$ETIQUETA" == "$MC2_SHA" ]] || docker push "${imagen}:${ETIQUETA}"
            fi
            echo "- \`${imagen}:${ETIQUETA}\`" >> "$GITHUB_STEP_SUMMARY"
          done

  # Despliegue con Compose. El runner sale de la variable MC2_DEPLOY_RUNNER del repositorio (por ejemplo,
  # «self-hosted» para el equipo del grupo); sin ella se usa un runner hospedado. Nunca recibe código de un
  # pull request: este job solo existe para main, tags y la reversión manual.
  desplegar:
    needs: publicar
    if: needs.publicar.result == 'success'
    runs-on: ${{ vars.MC2_DEPLOY_RUNNER || 'ubuntu-latest' }}
    environment:
      name: produccion
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      ETIQUETA: ${{ needs.publicar.outputs.etiqueta }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MC2_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Minecraft2/pom.xml
      - name: Iniciar sesión en GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$TOKEN"
          echo "MC2_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Versión estable anterior (destino de una reversión)
        id: anterior
        run: |
          estado="${MC2_DEPLOY_STATE:-$HOME/.mc2-deploy}"
          anterior=""
          [[ -f "$estado/ultima-buena" ]] && anterior="$(cat "$estado/ultima-buena")"
          # En un runner efímero no hay estado: se usa el tag de versión anterior a este commit.
          [[ -n "$anterior" && "$anterior" != "$ETIQUETA" ]] || anterior="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${MC2_SHA}^" 2>/dev/null || true)"
          echo "anterior=${anterior}" >> "$GITHUB_OUTPUT"
          echo "Versión anterior: ${anterior:-ninguna}"
      - name: Desplegar, readiness y humo
        env:
          MC2_LOAD_ZOMBIES: '80'
        run: scripts/deploy.sh "$ETIQUETA"
      - name: Carga corta contra el entorno desplegado (SLO)
        env:
          MC2_LOAD_ZOMBIES: '80'
          MC2_IMAGE_TAG: ${{ env.ETIQUETA }}
          MC2_LOAD_OUT: ${{ runner.temp }}/carga
        run: cd Minecraft2 && perf/run-slo.sh corta
      - name: Publicar resultados de carga
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carga-${{ env.ETIQUETA }}
          path: ${{ runner.temp }}/carga/
          if-no-files-found: warn
          retention-days: 30
      - name: Revertir a la versión anterior
        if: failure() && steps.anterior.outputs.anterior != ''
        env:
          MC2_IMAGE_TAG: ${{ env.ETIQUETA }}
        run: |
          scripts/rollback.sh "${{ steps.anterior.outputs.anterior }}"
          echo "### Reversión: ${ETIQUETA} → ${{ steps.anterior.outputs.anterior }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Resumen
        if: success()
        run: |
          {
            echo "### Desplegado: \`${ETIQUETA}\`"
            echo "- Runner: ${RUNNER_NAME} (${{ vars.MC2_DEPLOY_RUNNER || 'ubuntu-latest' }})"
            echo "- Juego: puerto 7777; noVNC: http://localhost:6080/vnc.html en el equipo del despliegue"
          } >> "$GITHUB_STEP_SUMMARY"

  # Reversión manual a una etiqueta publicada, con la misma readiness y la misma prueba de humo.
  revertir:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.MC2_DEPLOY_RUNNER || 'ubuntu-latest' }}
    environment:
      name: produccion
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Iniciar sesión en GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$TOKEN"
          echo "MC2_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Revertir y verificar
        env:
          DESTINO: ${{ inputs.revertir_a }}
        run: |
          scripts/rollback.sh "$DESTINO"
          echo "### Reversión manual verificada: \`${DESTINO}\`" >> "$GITHUB_STEP_SUMMARY"

  # Tags: Release con el JAR del cliente y las notas de CHANGELOG.md, solo con el despliegue verificado.
  release:
    needs: [publicar, desplegar]
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.desplegar.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Minecraft2/pom.xml
      - name: Empaquetar el cliente
        run: |
          mvn -B -ntp -f Minecraft2/pom.xml -DskipTests -Djacoco.skip=true package
          cp Minecraft2/target/minecraft2-*.jar "minecraft2-${GITHUB_REF_NAME}.jar"
          sha256sum "minecraft2-${GITHUB_REF_NAME}.jar" > "minecraft2-${GITHUB_REF_NAME}.jar.sha256"
      - name: Notas de la versión desde CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md > notas.md
          test -s notas.md || { echo "::error::CHANGELOG.md no tiene la sección [$version]"; exit 1; }
          registro="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo
            echo "Imágenes: \`${registro}/mc2-server:${GITHUB_REF_NAME}\` y \`${registro}/mc2-front:${GITHUB_REF_NAME}\`."
          } >> notas.md
      - name: Crear la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Minecraft2 ${GITHUB_REF_NAME}" \
            --notes-file notas.md "minecraft2-${GITHUB_REF_NAME}.jar" "minecraft2-${GITHUB_REF_NAME}.jar.sha256"
