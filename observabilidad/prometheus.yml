# Prometheus para Minecraft2: recoge /metrics de mc2-server (puerto 8080 de la red de Compose).
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/reglas.yml

scrape_configs:
  - job_name: mc2-server
    metrics_path: /metrics
    static_configs:
      - targets: ['mc2-server:8080']
        labels:
          servicio: mc2-server
